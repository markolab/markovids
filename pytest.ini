[pytest]
testpaths = tests
pythonpath = src tests
addopts = -ra --strict-markers
markers =
    known_bug: regression test documenting an existing production defect
    integration: real FFmpeg, Torch, or Numba runtime smoke test (requires --run-integration)
    gt: uses the committed ground-truth fixture in tests/data (runs by default)
    gt_full: full example sessions (MARKOVIDS_GT_DATA / MARKOVIDS_PRED_DATA, default <repo>/_tmp); requires --run-gt-full, skipped when data is absent
